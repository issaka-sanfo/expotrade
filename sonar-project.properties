# ─── SonarQube Configuration ─────────────────────────────────────────────────
sonar.projectKey=expotrade
sonar.projectName=ExpoTrade
sonar.projectVersion=1.0.0

# ─── Module Layout ───────────────────────────────────────────────────────────
sonar.modules=backend,frontend

# ─── Backend (Java / Spring Boot) ───────────────────────────────────────────
backend.sonar.projectName=ExpoTrade Backend
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=build/classes/java/main
backend.sonar.java.test.binaries=build/classes/java/test
backend.sonar.java.source=25
backend.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
backend.sonar.junit.reportPaths=build/test-results/test

# ─── Frontend (Angular / TypeScript) ────────────────────────────────────────
frontend.sonar.projectName=ExpoTrade Frontend
frontend.sonar.sources=src
frontend.sonar.tests=src
frontend.sonar.test.inclusions=**/*.spec.ts
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts
frontend.sonar.typescript.lcov.reportPaths=coverage/lcov.info
frontend.sonar.sourceEncoding=UTF-8

# ─── Global Exclusions ──────────────────────────────────────────────────────
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/build/**,**/*.min.js,**/*.min.css
