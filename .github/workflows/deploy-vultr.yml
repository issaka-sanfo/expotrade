name: Deploy Backend to Vultr VPC

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-vultr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/expotrade-backend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Test Backend
  # ────────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expotrade_test
          POSTGRES_USER: expotrade
          POSTGRES_PASSWORD: expotrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build & Test
        working-directory: ./backend
        run: mvn clean verify

  # ────────────────────────────────────────────────────────────────────────────
  # Build Docker Image & Push to GHCR
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ────────────────────────────────────────────────────────────────────────────
  # Deploy to Vultr VPC (Alpine Linux)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          port: ${{ secrets.VULTR_SSH_PORT || 22 }}
          script: |
            set -e

            # Log in to GHCR
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Navigate to project directory
            cd ${{ secrets.VULTR_DEPLOY_PATH || '/opt/expotrade' }}

            # Pull the latest backend image
            docker compose -f docker-compose.vultr.yml pull backend

            # Restart only the backend service (zero-downtime with --no-deps)
            docker compose -f docker-compose.vultr.yml up -d --no-deps backend

            # Clean up old images
            docker image prune -f

            # Verify the backend is healthy
            echo "Waiting for backend to start..."
            sleep 15
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
            else
              echo "WARNING: Health check did not pass yet — backend may still be starting"
            fi

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          port: ${{ secrets.VULTR_SSH_PORT || 22 }}
          script: |
            echo "=== Running Containers ==="
            docker ps --filter "name=backend" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            echo ""
            echo "=== Compose Status ==="
            cd ${{ secrets.VULTR_DEPLOY_PATH || '/opt/expotrade' }}
            docker compose -f docker-compose.vultr.yml ps

            echo ""
            echo "=== Backend Health ==="
            for i in 1 2 3; do
              if curl -sf http://localhost:8080/actuator/health; then
                echo ""
                echo "Deployment verified successfully!"
                exit 0
              fi
              echo "Attempt $i/3 — retrying in 10s..."
              sleep 10
            done

            echo "Deployment verification failed after 3 attempts"
            exit 1
